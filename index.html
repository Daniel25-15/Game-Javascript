<!doctype html>
<html>
  <head>
    <link rel="icon" href="data:," />
  </head>
  <style>
    html, body {
        overflow: hidden;
    }
    .game-container {
      position: relative;
      width: 800px;
      margin: 15px auto;
    }
    canvas {
      /* background-image: url('backgroundLoop.svg'); */
      /* background-repeat: no-repeat; */
      /* background-size: 100% 150%; */
      display: block;
      margin: 15px auto;
    }
    .explination {
      font-size: 18pt;
      font-weight: 400;
      margin-bottom: -5px;
      /* align-items: center; */
      text-align: center;
      visibility: hidden;
    }
    #start-game-button {
      font-size: 24pt;
      visibility: visible;
      width: 250px;
      height: 75px;
      text-align: center;
      border-radius: 5px;
      background: #3f3e3e;
      color: #fff;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-width: 5px;
      cursor: pointer;
      border-color: #fff;
      z-index: 10;
    }
    /* .health-bar {

        } */
  </style>
  <body>
    <div id="explinations" class="explination">
      Press 'E' to open and close the inventory
    </div>
    <div class="game-container">
      <canvas id="game" width="800" height="650"></canvas>
      <button id="start-game-button"> Start Game</button>
    </div>
    <script type="module" src="javascript.js"></script>
  </body>
</html>
